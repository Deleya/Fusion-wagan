version: '3.8'

services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=wagan_user
      - POSTGRES_PASSWORD=wagan_password
      - POSTGRES_DB=wagan_db
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine

  web:
    build: .
    # --preload : charge Django AVANT de forker les workers. Sans ça, le 1er
    # appel de chaque worker prend ~20s (imports lourds) et Meta abandonne la
    # vérification du webhook (erreur 499 côté nginx).
    command: gunicorn --workers=3 --preload --bind 0.0.0.0:8000 wagan_project.wsgi:application
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=wagan_project.settings.prod
      - DATABASE=postgres://wagan_user:wagan_password@db:5432/wagan_db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      # Autorise le frontend local et ngrok à communiquer avec l'API
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0,web,.ngrok-free.app,.ngrok.io
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://localhost
      # HTTPS_ENABLED=true uniquement en vrai déploiement avec certificat SSL
      - HTTPS_ENABLED=false
    restart: always
    depends_on:
      - db
      - redis

  celery_worker:
    build: .
    command: celery -A wagan_project worker -l info
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=wagan_project.settings.prod
      - DATABASE=postgres://wagan_user:wagan_password@db:5432/wagan_db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0,web,.ngrok-free.app,.ngrok.io
      - HTTPS_ENABLED=false
    restart: always
    depends_on:
      - db
      - redis
      - web


  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./staticfiles:/app/staticfiles
    depends_on:
      - web

volumes:
  postgres_data:
